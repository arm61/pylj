[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# NumPy's stubs use the type statement, which mypy accepts only for a 3.12 or
# later target, so type checking targets 3.12 on every supported interpreter.
[tool.mypy]
python_version = "3.12"
packages = ["pylj"]
