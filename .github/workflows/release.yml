name: publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the version matches the tag
        run: |
          built=$(ls dist/*.whl | sed -E 's|.*/pylj-([^-]+)-.*|\1|')
          if [ "$built" != "${GITHUB_REF_NAME}" ]; then
            echo "built $built but the release tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
